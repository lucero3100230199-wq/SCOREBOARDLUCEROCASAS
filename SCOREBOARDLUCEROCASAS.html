<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator Scoreboard</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f0f13;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(45deg, #ff4757, #1e90ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .team-card {
            background: #1e1e24;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 6px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Team custom colors */
        .team-0 { border-top-color: #ff4757; }
        .team-1 { border-top-color: #2ed573; }
        .team-2 { border-top-color: #1e90ff; }
        .team-3 { border-top-color: #ffa502; }

        .team-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            width: 100%;
            outline: none;
            margin-bottom: 10px;
            border-bottom: 2px solid transparent;
            padding: 4px;
        }
        .team-name:focus {
            border-bottom-color: #4b5563;
        }
        .score-box {
            position: relative;
            margin: 15px 0;
        }
        .score-input {
            font-size: 2.8rem;
            font-weight: 800;
            background: #15151a;
            border: 2px solid #2d2d35;
            border-radius: 12px;
            color: #fff;
            text-align: center;
            width: 90%;
            padding: 10px 5px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .score-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }
        .preview {
            display: block;
            height: 25px;
            font-size: 1.2rem;
            color: #10b981;
            font-weight: 700;
            margin-top: 8px;
        }
        .quick-btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .quick-btn {
            background-color: #2d2d35;
            color: #e5e7eb;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .quick-btn:hover {
            background-color: #3e3e4a;
        }
        .quick-btn:active {
            transform: scale(0.95);
        }
        .history-section {
            margin-top: 20px;
            border-top: 1px solid #2d2d35;
            padding-top: 10px;
            text-align: left;
            min-height: 120px;
        }
        .history-title {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .history-list {
            font-size: 0.8rem;
            color: #9ca3af;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .global-controls {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }
        .btn-reset {
            background-color: #ef4444;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-reset:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <h1>Calculator Scoreboard</h1>
    <div class="subtitle">
        Click any team's score to type operations directly (e.g., <code>50+20-5</code>). Press <strong>Enter</strong> or click outside to calculate.
    </div>

    <div class="scoreboard">
        <!-- Team 1 -->
        <div class="team-card team-0">
            <input type="text" class="team-name" value="Red Team">
            <div class="score-box">
                <input type="text" class="score-input" id="score-0" value="0" 
                       oninput="handleInput(0)" 
                       onblur="handleCommit(0)" 
                       onkeydown="if(event.key === 'Enter') this.blur()">
                <span class="preview" id="preview-0"></span>
            </div>
            <div class="quick-btn-group">
                <button class="quick-btn" onclick="quickAdjust(0, -10)">-10</button>
                <button class="quick-btn" onclick="quickAdjust(0, -1)">-1</button>
                <button class="quick-btn" onclick="quickAdjust(0, 1)">+1</button>
                <button class="quick-btn" onclick="quickAdjust(0, 10)">+10</button>
            </div>
            <div class="history-section">
                <div class="history-title">Recent Changes</div>
                <div class="history-list" id="history-0"></div>
            </div>
        </div>

        <!-- Team 2 -->
        <div class="team-card team-1">
            <input type="text" class="team-name" value="Green Team">
            <div class="score-box">
                <input type="text" class="score-input" id="score-1" value="0" 
                       oninput="handleInput(1)" 
                       onblur="handleCommit(1)" 
                       onkeydown="if(event.key === 'Enter') this.blur()">
                <span class="preview" id="preview-1"></span>
            </div>
            <div class="quick-btn-group">
                <button class="quick-btn" onclick="quickAdjust(1, -10)">-10</button>
                <button class="quick-btn" onclick="quickAdjust(1, -1)">-1</button>
                <button class="quick-btn" onclick="quickAdjust(1, 1)">+1</button>
                <button class="quick-btn" onclick="quickAdjust(1, 10)">+10</button>
            </div>
            <div class="history-section">
                <div class="history-title">Recent Changes</div>
                <div class="history-list" id="history-1"></div>
            </div>
        </div>

        <!-- Team 3 -->
        <div class="team-card team-2">
            <input type="text" class="team-name" value="Blue Team">
            <div class="score-box">
                <input type="text" class="score-input" id="score-2" value="0" 
                       oninput="handleInput(2)" 
                       onblur="handleCommit(2)" 
                       onkeydown="if(event.key === 'Enter') this.blur()">
                <span class="preview" id="preview-2"></span>
            </div>
            <div class="quick-btn-group">
                <button class="quick-btn" onclick="quickAdjust(2, -10)">-10</button>
                <button class="quick-btn" onclick="quickAdjust(2, -1)">-1</button>
                <button class="quick-btn" onclick="quickAdjust(2, 1)">+1</button>
                <button class="quick-btn" onclick="quickAdjust(2, 10)">+10</button>
            </div>
            <div class="history-section">
                <div class="history-title">Recent Changes</div>
                <div class="history-list" id="history-2"></div>
            </div>
        </div>

        <!-- Team 4 -->
        <div class="team-card team-3">
            <input type="text" class="team-name" value="Yellow Team">
            <div class="score-box">
                <input type="text" class="score-input" id="score-3" value="0" 
                       oninput="handleInput(3)" 
                       onblur="handleCommit(3)" 
                       onkeydown="if(event.key === 'Enter') this.blur()">
                <span class="preview" id="preview-3"></span>
            </div>
            <div class="quick-btn-group">
                <button class="quick-btn" onclick="quickAdjust(3, -10)">-10</button>
                <button class="quick-btn" onclick="quickAdjust(3, -1)">-1</button>
                <button class="quick-btn" onclick="quickAdjust(3, 1)">+1</button>
                <button class="quick-btn" onclick="quickAdjust(3, 10)">+10</button>
            </div>
            <div class="history-section">
                <div class="history-title">Recent Changes</div>
                <div class="history-list" id="history-3"></div>
            </div>
        </div>
    </div>

    <div class="global-controls">
        <button class="btn-reset" onclick="resetScores()">Reset All</button>
    </div>

    <script>
        const state = {
            scores: [0, 0, 0, 0],
            history: [[], [], [], []]
        };

        // Safely evaluates math expressions without using raw eval
        function evaluateExpression(str) {
            const sanitized = str.replace(/[^0-9+\-*/().\s]/g, '');
            if (sanitized.trim() === "") return 0;
            try {
                const result = new Function(`return (${sanitized})`)();
                return (typeof result === 'number' && isFinite(result)) ? result : null;
            } catch (e) {
                return null;
            }
        }

        // Live calculations preview as you type
        function handleInput(index) {
            const input = document.getElementById(`score-${index}`);
            const preview = document.getElementById(`preview-${index}`);
            const text = input.value;
            
            if (/[+\-*/]/.test(text)) {
                const result = evaluateExpression(text);
                if (result !== null) {
                    preview.textContent = `= ${result}`;
                    return;
                }
            }
            preview.textContent = "";
        }

        // Saves and formats the final calculation
        function handleCommit(index) {
            const input = document.getElementById(`score-${index}`);
            const text = input.value;
            const oldScore = state.scores[index];
            const result = evaluateExpression(text);
            
            if (result !== null) {
                state.scores[index] = result;
                if (oldScore !== result) {
                    addHistory(index, `${text} = ${result}`);
                }
            }
            updateDisplay(index);
        }

        // Adds record to local log
        function addHistory(index, record) {
            state.history[index].unshift(record);
            if (state.history[index].length > 5) {
                state.history[index].pop();
            }
            renderHistory(index);
        }

        // Renders changes history
        function renderHistory(index) {
            const historyDiv = document.getElementById(`history-${index}`);
            historyDiv.innerHTML = state.history[index]
                .map(item => {
                    const parts = item.split(' = ');
                    return `<div class="history-item"><span>${parts[0]}</span><span style="color: #10b981; font-weight: bold;">= ${parts[1]}</span></div>`;
                })
                .join('');
        }

        // Updates raw layout text
        function updateDisplay(index) {
            const input = document.getElementById(`score-${index}`);
            input.value = state.scores[index];
            const preview = document.getElementById(`preview-${index}`);
            preview.textContent = "";
        }

        // Hotkeys adjustment (+1, +10, -1, -10)
        function quickAdjust(index, amount) {
            const input = document.getElementById(`score-${index}`);
            const currentText = input.value;
            const operator = amount >= 0 ? "+" : "";
            
            input.value = `${currentText}${operator}${amount}`;
            handleCommit(index);
        }

        // Resets state completely
        function resetScores() {
            if (confirm("Are you sure you want to reset all scores and history logs?")) {
                for (let i = 0; i < 4; i++) {
                    state.scores[i] = 0;
                    state.history[i] = [];
                    updateDisplay(i);
                    renderHistory(i);
                }
            }
        }

        // Init views
        for (let i = 0; i < 4; i++) {
            updateDisplay(i);
        }
    </script>
</body>
</html>
